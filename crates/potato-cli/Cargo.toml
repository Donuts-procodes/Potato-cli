[package]
name = "potato-cli"
version = "0.1.0"
edition = "2021"
authors = ["Potato Engine Contributors"]
description = "High-performance native Super Loop Agent engine for autonomous local filesystem modification"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"

[[bin]]
name = "potato"
path = "src/main.rs"
